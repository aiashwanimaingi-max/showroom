<style>
:root{
  --red:#cc0000; --red-dark:#990000; --red-soft:#fdecec;
  --bg:#f5f5f4; --card:#ffffff; --ink:#1c1c1c; --muted:#6b6b6b; --line:#e3e3e1;
  --green:#137333; --green-soft:#e6f4ea; --amber:#a15c00; --amber-soft:#fff4e0;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:12px;opacity:.85}
header .grow{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--red);border-bottom-color:var(--red)}
main{max-width:1440px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat.red .v{color:var(--red)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid #cfcfcc;border-radius:7px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
textarea{min-height:60px;resize:vertical}
.span2{grid-column:span 2}
@media (max-width:520px){.span2{grid-column:span 1}}
.btn{border:1px solid var(--red);background:var(--red);color:#fff;padding:8px 14px;border-radius:7px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-dark)}
.btn.ghost{background:#fff;color:var(--red)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.plain{border-color:#cfcfcc;background:#fff;color:var(--ink)}
label.btn{display:inline-flex;flex-direction:row;align-items:center;width:auto}
.imp td,.imp th{font-size:13px;padding:5px 8px}
details{margin-top:8px;font-size:13px}
details ul{max-height:160px;overflow:auto;margin:6px 0;padding-left:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#fafaf9;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fcfcfb}
table.nice th{background:#fbf3f3;color:#7a2a2a;font-size:11px;padding:10px 9px;border-bottom:2px solid #f0dcdc}
table.nice td{padding:11px 9px;vertical-align:top}
table.nice tbody tr:nth-child(even) td{background:#fcfcfb}
table.nice tbody tr:hover td{background:#fff3e6}
tr.click{cursor:pointer}
table.nice td.wrap{white-space:normal;min-width:130px;max-width:210px}
table.nice tfoot td{border-top:2px solid #e3e3e1;padding:12px}
.sub2{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.amt{font-weight:700;font-variant-numeric:tabular-nums}.amt.neg{color:#c00}.amt.pos{color:var(--green)}.amt.ok{color:var(--green)}
a.fill{color:var(--amber);font-weight:600;text-decoration:none;border-bottom:1px dashed}
.stat .sub2{margin-top:4px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.in{background:var(--green-soft);color:var(--green)}
.pill.sold{background:#eee;color:#555}
.pill.due{background:var(--amber-soft);color:var(--amber)}
.pill.open{background:#e8f0fe;color:#1a56c4}
.pill.lost{background:#eee;color:#777}
.muted{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.tot td{font-weight:700;background:#fafaf9}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.warn{background:var(--amber-soft);color:var(--amber);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
dialog{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex}
dialog .db{padding:16px}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#syncbar{position:fixed;bottom:16px;right:16px;background:#1a56c4;color:#fff;padding:8px 10px 8px 14px;border-radius:10px;z-index:40;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#syncbar .btn{background:#fff;color:#1a56c4;border-color:#fff}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;padding:10mm;font-size:13px}
  #print table{font-size:13px}
  #print th,#print td{border:1px solid #999;white-space:normal}
}
@media (pointer:coarse){input,select,textarea{font-size:16px}nav button{padding:14px 16px}}
html{-webkit-text-size-adjust:100%}
.rc h3{margin:0;color:var(--red);font-size:22px}
.rc .hd{border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.rc .sign{display:flex;justify-content:space-between;margin-top:60px}
</style>
</head>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n};
const rs=n=>'₹'+Math.round(num(n)).toLocaleString('en-IN');
const fd=d=>d?d.split('-').reverse().join('-'):'';
const up=s=>String(s||'').trim().toUpperCase();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function formData(f){const o={};new FormData(f).forEach((v,k)=>o[k]=typeof v==='string'?v.trim():v);return o}
const opts=(arr,sel)=>arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const dl=(id,arr)=>`<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const saleDue=s=>num(s.total)-num(s.finance)-num(s.exchangeValue)-(s.payments||[]).reduce((a,p)=>a+num(p.amount),0);
const saleReceived=s=>(s.payments||[]).reduce((a,p)=>a+num(p.amount),0);

  return `<div class="tablewrap"><table><tr><th>Model</th>${cols.map(k=>`<th class="num">${esc(k)}</th>`).join('')}<th class="num">Total</th></tr>

  const rows=DB.stock.filter(s=>(stockF==='all'||(stockF==='sold'?s.status==='sold':stockF==='returned'?s.status==='returned':isIn(s)))&&(!q||[s.chassis,s.engine,s.model,s.colour,s.key,s.challan].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);

const isIn=s=>s.status!=='sold'&&s.status!=='returned';

  <form id="frp" class="grid">

    <label class="span2">Reason<input name="reason" placeholder="e.g. paint defect, scratch, engine noise"></label>
    <label>Replacement / return challan no.<input name="rchallan" placeholder="optional"></label>
    <h3 class="span2" style="grid-column:1/-1;font-size:14px;margin:8px 0 0">New vehicle received</h3>
    <label>Model<input name="model" list="dlModels" value="${esc(o.model)}" required></label>
    <label>Colour<input name="colour" list="dlCols" value="${esc(o.colour)}"></label>
    <label>Engine No<input name="engine" class="mono" required></label>
    <label>Chassis No<input name="chassis" class="mono" required></label>
    <label>Key No<input name="key" class="mono"></label>
    <label>Purchase Challan No<input name="challan" value="${esc(o.challan)}"></label>
  </form>${dl('dlModels',DB.settings.models)}${dl('dlCols',DB.settings.colours)}
  <p class="note">The old vehicle is kept in records as <b>Returned</b> (filter “Returned / replaced”) and linked to the new one. The new vehicle goes into stock.</p>`,
  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveReplace('${id}')">Save replacement</button>`);
}
function saveReplace(id){
  const f=$('#frp'); if(!f.reportValidity()) return; const d=formData(f), o=DB.stock.find(x=>x.id===id);
  const ch=up(d.chassis), en=up(d.engine);
  const dup=DB.stock.find(x=>(ch&&x.chassis===ch)||(en&&x.engine===en));
  if(dup){alert(`A vehicle with this ${dup.chassis===ch?'chassis':'engine'} number is already in the records (${dup.model}).`);return}
  const nid=uid();
  DB.stock.push({id:nid,created:Date.now(),status:'in',date:d.date||today(),challan:d.challan,model:d.model,colour:d.colour,engine:en,chassis:ch,key:up(d.key),cost:o.cost||'',replaces:o.id,replaceNote:[d.reason,d.rchallan?'Repl. challan '+d.rchallan:''].filter(Boolean).join(' · ')});
  Object.assign(o,{status:'returned',replacedBy:nid,returnDate:d.date||today(),returnReason:d.reason,returnChallan:d.rchallan});
  stSel.delete(o.id);
  if(d.model&&!DB.settings.models.includes(d.model))DB.settings.models.push(d.model);
  if(d.colour&&!DB.settings.colours.includes(d.colour))DB.settings.colours.push(d.colour);
  save(); dlg.close(); render(); toast('Vehicle replaced');
}
function viewReplace(id){
  const o=DB.stock.find(x=>x.id===id), n=DB.stock.find(x=>x.id===o.replacedBy);
  const row=(l,v)=>`<tr><td class="muted">${l}</td><td>${v}</td></tr>`;
  openDlg('Replaced vehicle',`<table>${row('Returned vehicle',`${esc(o.model)} ${esc(o.colour)}<br><span class="mono">Ch ${esc(o.chassis)} · Eng ${esc(o.engine)}</span>`)}
  ${row('Purchase challan',esc(o.challan)||'—')}${row('Returned on',fd(o.returnDate||''))}${row('Reason',esc(o.returnReason)||'—')}${row('Replacement challan',esc(o.returnChallan)||'—')}
  ${n?row('Replaced by',`${esc(n.model)} ${esc(n.colour)}<br><span class="mono">Ch ${esc(n.chassis)} · Eng ${esc(n.engine)}</span><br>Status: ${n.status==='sold'?'Sold':n.status==='returned'?'Returned':'In stock'}`):''}</table>`,
  `<button class="btn plain" style="margin-right:auto;color:var(--red)" onclick="undoReplace('${id}')">Undo replacement</button><button class="btn" onclick="dlg.close()">Close</button>`);
}
function undoReplace(id){
  const o=DB.stock.find(x=>x.id===id), n=DB.stock.find(x=>x.id===o.replacedBy);
  if(n&&n.status==='sold'){alert('The replacement vehicle is already sold — cancel that sale first.');return}
  if(!confirm('Undo this replacement? The new vehicle will be removed and the old one goes back to stock.')) return;
  if(n) DB.stock=DB.stock.filter(x=>x.id!==n.id);
  o.status='in'; delete o.replacedBy; delete o.returnDate; delete o.returnReason; delete o.returnChallan;
  save(); dlg.close(); render(); toast('Replacement undone');
}
function stockRows(){const q=stockQ.toLowerCase();return DB.stock.filter(s=>(stockF==='all'||(stockF==='sold'?s.status==='sold':stockF==='returned'?s.status==='returned':isIn(s)))&&(!q||[s.chassis,s.engine,s.model,s.colour,s.key,s.challan].join(' ').toLowerCase().includes(q)))}
function stDeleteAll(){
  const rows=stockRows(), sold=rows.filter(s=>s.status==='sold'&&s.saleId&&DB.sales.some(z=>z.id===s.saleId)), del=rows.filter(s=>!sold.includes(s));
  if(!del.length){alert(rows.length?'All vehicles in this list are sold — they cannot be deleted.':'There are no vehicles in the list.');return}
  const what=stockQ?`search “${stockQ}”`:stockF==='in'?'in-stock':stockF==='sold'?'sold-list':'all';
  const ans=prompt(`⚠ ${del.length} (${what}) vehicles will be permanently deleted — from all devices.${sold.length?`\n(${sold.length} sold vehicles will not be deleted.)`:''}\n\nTake a backup first.\n\nTo confirm, type the number ${del.length} below:`);
  if(ans===null) return;
  if(txt(ans)!==String(del.length)){alert('Number did not match — nothing was deleted.');return}
  const ids=new Set(del.map(s=>s.id)); DB.stock=DB.stock.filter(s=>!ids.has(s.id)); stSel.clear(); save(); render(); toast(`${ids.size} vehicles deleted`);
}
function stDelete(){
  const sel=DB.stock.filter(s=>stSel.has(s.id));
  const sold=sel.filter(s=>s.status==='sold'&&s.saleId&&DB.sales.some(z=>z.id===s.saleId)), del=sel.filter(s=>!sold.includes(s));
  if(!del.length){alert('All selected vehicles are sold. To delete a sold vehicle, first cancel its sale in Sales.');return}
  if(!confirm(`${del.length} vehicles will be permanently deleted from stock (all devices).${sold.length?`\n${sold.length} sold vehicles will not be deleted.`:''}\n\nDelete them?`)) return;
  const ids=new Set(del.map(s=>s.id)); DB.stock=DB.stock.filter(s=>!ids.has(s.id)); stSel.clear(); save(); render(); toast(`${ids.size} vehicles deleted`);
}
function addStock(e){
  e.preventDefault(); const f=e.target, d=formData(f);
  d.chassis=up(d.chassis); d.engine=up(d.engine); d.key=up(d.key);
  const dup=DB.stock.find(s=>s.chassis===d.chassis||s.engine===d.engine);
  if(dup && !confirm(`A vehicle with this ${dup.chassis===d.chassis?'chassis':'engine'} number already exists (${dup.model}). Save anyway?`)) return;
  DB.stock.push({id:uid(),created:Date.now(),status:'in',...d});
  if(d.model && !DB.settings.models.includes(d.model)) DB.settings.models.push(d.model);
  if(d.colour && !DB.settings.colours.includes(d.colour)) DB.settings.colours.push(d.colour);
  save(); toast('Vehicle added to stock');
  const keep={challan:d.challan,model:d.model,colour:d.colour,date:d.date};
  vStock(); const nf=$('#fStock'); for(const k in keep) nf[k].value=keep[k]; nf.engine.focus();
}
function dupPlan(){
  const key=s=>up(s.chassis)||(up(s.engine)?'E:'+up(s.engine):''), groups={};
  DB.stock.forEach(s=>{const k=key(s); if(k)(groups[k]=groups[k]||[]).push(s)});
  // also join rows that share an engine no but differ / miss chassis
  const byEng={}; DB.stock.forEach(s=>{const e=up(s.engine); if(e)(byEng[e]=byEng[e]||[]).push(s)});
  const seen=new Set(), sets=[];
  for(const g of [...Object.values(groups),...Object.values(byEng)]){ if(g.length<2) continue;
    const ids=g.map(x=>x.id).sort().join(); if(seen.has(ids)) continue; seen.add(ids); sets.push(g) }
  const remove=[], keep=[], stuck=[], gone=new Set();
  const good=c=>c&&!/[,;&]/.test(c);
  for(const g0 of sets){ const g=g0.filter(x=>!gone.has(x.id)); if(g.length<2) continue;
    const used=x=>x.status==='sold'&&x.saleId&&DB.sales.some(z=>z.id===x.saleId);
    const rank=x=>(used(x)?0:10)+(good(x.challan)?0:2)+(x.status==='sold'?0:1);
    g.sort((a,b)=>rank(a)-rank(b)||(a.created||0)-(b.created||0));
    const k=g[0]; keep.push(k);
    g.slice(1).forEach(x=>{ if(used(x)) stuck.push(x); else {remove.push({x,k}); gone.add(x.id)} });
  }
  return {remove,keep,stuck};
}
function dupReview(){
  const P=dupPlan();
  if(!P.remove.length){toast('No duplicate vehicles found');return}
  openDlg(`${P.remove.length} duplicate vehicles found`,`<p style="margin-top:0">The same Chassis / Engine number has been entered more than once. <b>One</b> entry per vehicle will be kept (the sold one, or the one with a proper challan no.); the rest will be removed:</p>

  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveSale('${enqId||''}')">Save sale</button>`);

function saleCalc(){const f=$('#fs');if(!f)return;const t=num(f.price.value)+num(f.extra.value);$('#cT').textContent=rs(t);$('#cD').textContent=rs(t-num(f.finance.value)-num(f.exchangeValue.value)-num(f.paid.value))}
function saveSale(enqId){
  const f=$('#fs'); if(!f.reportValidity()) return; const d=formData(f);
  const st=DB.stock.find(s=>s.id===d.stockId);
  const id=uid(), inv=Math.max(num(DB.settings.nextInv)||1,1+Math.max(0,...DB.sales.map(x=>num(x.inv)))); DB.settings.nextInv=inv+1;
  const sale={id,inv,schallan:d.schallan,created:Date.now(),date:d.date,stockId:st.id,model:st.model,colour:st.colour,chassis:st.chassis,engine:st.engine,key:st.key,
    name:d.name,rel:d.rel,relName:d.relName,phone:d.phone,address:d.address,price:num(d.price),extra:num(d.extra),total:num(d.price)+num(d.extra),
    finance:num(d.finance),financer:d.financer,financeReceived:false,exchange:d.exchange,exchangeValue:num(d.exchangeValue),notes:d.notes,payments:[]};
  DB.sales.push(sale); st.status='sold'; st.saleId=id;
  if(num(d.paid)>0) addPayment(sale,{date:d.date,amount:num(d.paid),mode:d.mode,ref:d.ref});
  if(enqId){const e=DB.enquiries.find(x=>x.id===enqId); if(e) e.status='Sold'}
  save(); dlg.close(); toast('Sale saved · Invoice #'+inv); render(); viewSale(id);
}
function addPayment(sale,p){
  const pid=uid(); sale.payments.push({id:pid,...p});

    particulars:`Sale #${sale.inv} – ${sale.name} (${sale.model})${p.ref?' · '+p.ref:''}`,saleId:sale.id,payId:pid});
}

const finRecd=s=>s.financeReceived?(s.financeRecdAmt!=null&&s.financeRecdAmt!==''?num(s.financeRecdAmt):num(s.finance)):0;
const finDiff=s=>s.financeReceived?finRecd(s)-num(s.finance):0;
const diffPill=d=>Math.abs(d)<0.5?'':d<0?`<span class="pill due">${rs(-d)} short</span>`:`<span class="pill open">${rs(d)} excess</span>`;

function financeRecv(id){

  const de=DB.daybook.find(d=>d.fin&&d.saleId===id);

function financeSave(id){
  const s=DB.sales.find(x=>x.id===id), d=formData($('#ffr')), a=num(d.amount); if(a<=0){alert('Enter the amount received.');return}
  Object.assign(s,{financeReceived:true,financeRecdAmt:a,financeRecdDate:d.date||today(),financeRef:d.ref,financeNote:d.note});
  const part=`Finance ${s.financer||''} – Sale #${s.inv} ${s.name}${d.ref?' · '+d.ref:''}`;
  let de=DB.daybook.find(x=>x.fin&&x.saleId===id);
  if(de) Object.assign(de,{date:s.financeRecdDate,amount:a,mode:d.mode,particulars:part});
  else DB.daybook.push({id:uid(),created:Date.now(),date:s.financeRecdDate,type:'in',mode:d.mode,amount:a,particulars:part,saleId:id,fin:true});
  save(); render(); viewSale(id); const df=a-num(s.finance); toast(Math.abs(df)<0.5?'Finance received in full ✓':df<0?`Finance ${rs(-df)} short`:`Finance ${rs(df)} excess`);

function financeUndo(id){

function salesTable(rows,summary){
  if(!rows.length) return '<div class="empty">No sales yet.</div>';
  const sum=f=>rows.reduce((a,s)=>a+f(s),0);
  const diffCell=s=>{ if(!num(s.finance)) return '<span class="muted">—</span>'; if(!s.financeReceived) return '<span class="muted">—</span>';
    const d=finDiff(s); return Math.abs(d)<0.5?'<span class="amt ok">✓ Full</span>':d<0?`<span class="amt neg">− ${rs(-d)}</span><div class="sub2">short</div>`:`<span class="amt pos">+ ${rs(d)}</span><div class="sub2">excess</div>`};
  const finCellN=s=>num(s.finance)?`<b>${rs(s.finance)}</b><div class="sub2">${esc(s.financer)||''}</div>`:(s.financer?`<a href="#" class="fill" onclick="setFinance('${s.id}');return false">+ Add amount</a><div class="sub2">${esc(s.financer)}</div>`:'<span class="muted">—</span>');
  const recCell=s=>!num(s.finance)?'<span class="muted">—</span>':s.financeReceived?`<b>${rs(finRecd(s))}</b><div class="sub2">${fd(s.financeRecdDate||'')}</div>`:`<button class="btn ghost sm" onclick="financeRecv('${s.id}')">Mark received</button>`;
  const tD=sum(s=>finDiff(s));
  const cards=summary?`<div class="stats" style="margin-bottom:14px">
    <div class="stat"><div class="k">Total sales</div><div class="v">${rows.length}</div><div class="sub2">${rs(sum(s=>num(s.total)))}</div></div>
    <div class="stat"><div class="k">Finance (bill)</div><div class="v">${rs(sum(s=>num(s.finance)))}</div></div>
    <div class="stat"><div class="k">Finance received</div><div class="v" style="color:var(--green)">${rs(sum(s=>finRecd(s)))}</div></div>
    <div class="stat"><div class="k">Finance pending</div><div class="v" style="color:var(--amber)">${rs(sum(s=>num(s.finance)&&!s.financeReceived?num(s.finance):0))}</div></div>
    <div class="stat"><div class="k">Finance short / excess</div><div class="v" style="color:${tD<-0.5?'var(--red)':tD>0.5?'var(--green)':'inherit'}">${Math.abs(tD)<0.5?'₹0':(tD<0?'− ':'+ ')+rs(Math.abs(tD))}</div></div>
    <div class="stat"><div class="k">Customer dues</div><div class="v" style="color:var(--red)">${rs(sum(s=>Math.max(0,saleDue(s))))}</div></div></div>`:'';
  return cards+`<div class="tablewrap"><table class="nice"><thead><tr><th>Sale Challan</th><th>Purch. Challan</th><th>Date</th><th>Customer</th><th>Vehicle</th><th class="num">Total</th><th class="num">Finance</th><th class="num">Finance received</th><th class="num">Short / Excess</th><th class="num">From customer</th><th class="num">Due</th></tr></thead><tbody>
  ${rows.map(s=>{const due=saleDue(s);return `<tr class="click" title="Click to open" onclick="if(!event.target.closest('button,a'))viewSale('${s.id}')">
    <td><b>${esc(s.schallan)||'<span class="muted">—</span>'}</b><div class="sub2">Rcpt #${s.inv}</div></td>
    <td>${(st=>st&&st.challan?esc(st.challan):`<span class="muted">—</span>`)(DB.stock.find(x=>x.id===s.stockId))}</td>
    <td>${fd(s.date)}</td>
    <td class="wrap"><b>${esc(s.name)}</b><div class="sub2">${esc(s.rel||'')} ${esc(s.relName||'')}${s.phone?' · '+esc(s.phone):''}</div></td>
    <td class="wrap">${esc(s.model)} <span class="muted">${esc(s.colour||'')}</span><div class="sub2 mono">${esc(s.chassis)}</div></td>
    <td class="num"><b>${rs(s.total)}</b></td>
    <td class="num">${finCellN(s)}</td>
    <td class="num">${recCell(s)}</td>
    <td class="num">${diffCell(s)}</td>
    <td class="num">${rs(saleReceived(s)+num(s.exchangeValue))}</td>
    <td class="num">${due>0.5?`<span class="pill due">${rs(due)}</span>`:'<span class="pill in">Paid</span>'}</td></tr>`}).join('')}</tbody>
  <tfoot><tr class="tot"><td colspan="5">Total (${rows.length})</td><td class="num">${rs(sum(s=>num(s.total)))}</td><td class="num">${rs(sum(s=>num(s.finance)))}</td><td class="num">${rs(sum(s=>finRecd(s)))}</td>
    <td class="num">${Math.abs(tD)<0.5?'—':`<span class="amt ${tD<0?'neg':'pos'}">${tD<0?'− ':'+ '}${rs(Math.abs(tD))}</span>`}</td><td class="num">${rs(sum(s=>saleReceived(s)+num(s.exchangeValue)))}</td><td class="num">${rs(sum(s=>Math.max(0,saleDue(s))))}</td></tr></tfoot></table></div>`;
}

function saveEditSale(id){
  const f=$('#fes'); if(!f.reportValidity()) return; const d=formData(f), s=DB.sales.find(x=>x.id===id), st=DB.stock.find(x=>x.id===s.stockId);
  const ch=up(d.chassis), en=up(d.engine);
  const clash=DB.stock.find(x=>x.id!==s.stockId&&((ch&&x.chassis===ch)||(en&&x.engine===en)));
  if(clash&&!confirm(`Another vehicle in stock already has this ${clash.chassis===ch?'chassis':'engine'} number (${clash.model}). Save anyway?`)) return;
  Object.assign(s,{schallan:d.schallan,date:d.date||s.date,name:d.name,rel:d.rel,relName:d.relName,phone:d.phone,address:d.address,model:d.model,colour:d.colour,chassis:ch,engine:en,key:up(d.key),
    price:num(d.price),extra:num(d.extra),total:num(d.price)+num(d.extra),finance:num(d.finance),financer:d.financer,exchange:d.exchange,exchangeValue:num(d.exchangeValue),notes:d.notes});
  if(st) Object.assign(st,{challan:d.pchallan,model:d.model,colour:d.colour,chassis:ch,engine:en,key:up(d.key)});
  if(d.model&&!DB.settings.models.includes(d.model))DB.settings.models.push(d.model);
  if(d.colour&&!DB.settings.colours.includes(d.colour))DB.settings.colours.push(d.colour);
  const keep=[];
  document.querySelectorAll('#espT tr[data-pid]').forEach((tr,i)=>{
    const p=s.payments[i]; if(!p) return; const g=n=>tr.querySelector(`[name=${n}]`);
    const de=p.id&&DB.daybook.find(x=>x.payId===p.id);
    if(g('pdel').checked){ if(de) DB.daybook=DB.daybook.filter(x=>x!==de); return }
    Object.assign(p,{date:g('pdate').value||p.date,amount:num(g('pamt').value),mode:g('pmode').value,ref:txt(g('pref').value)});
    if(de) Object.assign(de,{date:p.date,amount:p.amount,mode:p.mode,particulars:`Sale #${s.inv} – ${s.name} (${s.model})${p.ref?' · '+p.ref:''}`});
    keep.push(p);
  });
  if(document.querySelector('#espT')) s.payments=keep;
  const fe=DB.daybook.find(x=>x.fin&&x.saleId===id); if(fe) fe.particulars=`Finance ${s.financer||''} – Sale #${s.inv} ${s.name}`;
  save(); render(); viewSale(id); toast('Sale updated');
}
function setSChallan(id){

function delSale(id){

}

function download(name,text,type){

function csv(which){

    daybook:['date','type','particulars','mode','amount'],enquiries:['date','name','phone','model','exchange','followUp','status','notes'],
    capital:['date','partner','type','mode','note','invested','withdrawn']}[which];
  const rows=DB[which].map(r=>which==='stock'?{...r,saleChallan:(DB.sales.find(z=>z.id===r.saleId)||{}).schallan||''}:which==='sales'?{...r,purchaseChallan:(DB.stock.find(x=>x.id===r.stockId)||{}).challan||'',received:saleReceived(r),due:Math.round(saleDue(r)),financeRecdAmt:r.financeReceived?finRecd(r):'',financeShortExcess:r.financeReceived?Math.round(finDiff(r)):''}:which==='daybook'?{...r,type:r.type==='in'?'Receipt':'Payment'}:which==='capital'?{...r,partner:pName(r.partnerId),type:CAP_T[r.type],invested:r.type!=='out'?r.amount:'',withdrawn:r.type==='out'?r.amount:''}:r);

}

const CAP_T={in:'Money invested (given to business)',exp:'Business expense paid from own pocket',out:'Money withdrawn'};
const pName=id=>DB.partners.find(p=>p.id===id)?.name||'?';
let capF='';
function partnerSummary(){
  const P=DB.partners.map(p=>{const c=DB.capital.filter(x=>x.partnerId===p.id);
    const put=c.filter(x=>x.type!=='out').reduce((a,x)=>a+num(x.amount),0), took=c.filter(x=>x.type==='out').reduce((a,x)=>a+num(x.amount),0);
    return {...p,share:num(p.share),put,took,net:put-took}});
  const totShare=P.reduce((a,p)=>a+p.share,0), agreed=num(DB.settings.agreedCapital);
  // With an agreed total, each partner owes their share of it. Without one, the partner who is furthest
  // ahead (relative to their share) sets the level the others should match.
  const base=agreed>0?agreed:Math.max(0,...P.map(p=>p.share>0?p.net/(p.share/(totShare||1)):0));
  P.forEach(p=>{p.should=totShare?base*p.share/totShare:0; p.pending=p.should-p.net});
  return {P,totShare,agreed,total:P.reduce((a,p)=>a+p.net,0)};
}
const pendPill=p=>p.pending>0.5?`<span class="pill due">${rs(p.pending)} pending</span>`:p.pending<-0.5?`<span class="pill in">${rs(-p.pending)} excess</span>`:'<span class="pill in">Full</span>';

  <p class="note">${S.agreed>0?`The agreed total capital ${rs(S.agreed)} is split by share (%) to get “Should be”.`:`No total capital is set, so “Pending” shows how much each partner must add to match the partner who has invested the most relative to their share.`}
  ${S.totShare!==100?' <b>Note: shares do not add up to 100%.</b>':''}</p>`

  ${DB.partners.length?`<div class="card"><h2>New entry</h2><form id="fcap" class="grid" onsubmit="addCap(event)">

function ptRow(p){return `<div class="row pt" style="margin-bottom:6px;flex-wrap:nowrap"><input type="hidden" value="${esc(p.id||'')}"><input placeholder="Partner name" value="${esc(p.name)}" style="flex:3;min-width:0"><input placeholder="Share" inputmode="decimal" value="${esc(p.share??'')}" style="width:80px"><span>%</span></div>`}
function savePartners(){
  const rows=[...document.querySelectorAll('#ptRows .pt')].map(r=>{const i=r.querySelectorAll('input');return {id:i[0].value||uid(),name:String(i[1].value).trim(),share:num(i[2].value)}});
  const keep=rows.filter(p=>p.name), dropped=DB.partners.filter(p=>!keep.some(k=>k.id===p.id));
  if(dropped.some(p=>DB.capital.some(c=>c.partnerId===p.id))){alert('A partner with entries cannot be removed. Delete their entries first.');return}
  if(keep.length&&Math.round(keep.reduce((a,p)=>a+p.share,0))!==100&&!confirm('Shares do not add up to 100%. Save anyway?')) return;

function capList(){
  const el=$('#capList'); if(!el) return;
  const rows=DB.capital.filter(c=>!capF||c.partnerId===capF).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.created-a.created);

  <td class="num">${c.type!=='out'?rs(c.amount):''}</td><td class="num">${c.type==='out'?rs(c.amount):''}</td><td><button class="btn plain sm" onclick="delCap('${c.id}')">Delete</button></td></tr>`).join('')}</table></div>`
  :'<div class="empty">No entries.</div>';

function addCap(e){
  e.preventDefault(); const d=formData(e.target), a=num(d.amount); if(a<=0) return;
  const id=uid(), t0=Date.now(), nm=pName(d.partnerId), note=d.note?' · '+d.note:'';
  DB.capital.push({id,created:t0,date:d.date,partnerId:d.partnerId,type:d.type,amount:a,mode:d.mode,note:d.note});
  if(d.toDay){
    // Money a partner brings in is cash in; an expense paid from their own pocket is capital in + expense out.
    if(d.type!=='out') DB.daybook.push({id:uid(),created:t0,date:d.date,type:'in',mode:d.mode,amount:a,particulars:`Capital – ${nm}${d.type==='exp'?' (expense paid personally)':note}`,capId:id});
    if(d.type==='exp') DB.daybook.push({id:uid(),created:t0+1,date:d.date,type:'out',mode:d.mode,amount:a,particulars:`${d.note||'Expense'} (paid by ${nm})`,capId:id});
    if(d.type==='out') DB.daybook.push({id:uid(),created:t0,date:d.date,type:'out',mode:d.mode,amount:a,particulars:`Withdrawal – ${nm}${note}`,capId:id});
  }
  save(); toast('Saved'); vPartners();
}
function delCap(id){
  if(!confirm('Delete this entry? It will also be removed from the Day Book.')) return;
  DB.capital=DB.capital.filter(c=>c.id!==id); DB.daybook=DB.daybook.filter(d=>d.capId!==id); save(); vPartners();
}

const SALES_SCHEMA=objSchema({sales:{type:'array',items:SALE_SCHEMA}});
async function aiSale(files){
  try{
    const a=await aiPrep(files,'Reading bills…'); if(!a) return;
    const prompt=`These are sale documents from an Indian two-wheeler dealership (Honda): sale invoices / bills, booking forms, delivery challans / receipts, or handwritten sale register pages. There may be MANY bills — one or more per photo or page.
Return EVERY vehicle sale you find in "sales", one entry per vehicle sold. Do not merge two bills, and do not skip any.
For each sale:
- sale_challan_no: the SHOWROOM'S OWN sale number for that bill. On handwritten register pages this is the number written inside a CIRCLE at the top of the page (e.g. a circled "48"). On printed bills it is the bill / invoice / delivery challan number. ONE number only, never several joined.
- purchase_challan_no: the supplier's challan number with which this vehicle was PURCHASED by the showroom. On handwritten pages it is written as "Challan No: ...." (e.g. "Challan No: 7316"). Empty if not shown. Never put the circled number here.
- key_no: key number if written (e.g. "Key No: PN90").
- A date written in the margin or top corner of a handwritten page (e.g. 22-11-26) is the sale date.
- phone: the first mobile number. notes: put any second mobile number and the battery number here, e.g. "Mob 2: 7015712076 · Battery: 50611320467598".
- Example of a handwritten page: circled "47" at top → sale_challan_no "47"; "Challan No: 6411" → purchase_challan_no "6411"; "Name: Sani W/o Moseen" → customer_name "Sani", relation "W/o", relative_name "Moseen".
- customer_name; relation (S/o, W/o, D/o or C/o as written); relative_name (father / husband name); phone (10-digit mobile); address.
- model, colour, engine number and chassis (frame / VIN) number. Copy engine and chassis exactly, in capitals with no spaces; do not confuse 0/O, 1/I, 5/S, 8/B.
  If the model or colour matches one of these names used by the dealership, use that exact name: Models: ${DB.settings.models.join(', ')}. Colours: ${DB.settings.colours.join(', ')}.
- price: vehicle price / on-road price. accessories: accessories or extra charges shown separately, else 0.
- finance_amount and financer (bank / finance company) if financed, else 0 and "". exchange_vehicle and exchange_value if an old vehicle was taken in exchange.
- paid_amount: money the customer paid (cash / down payment / advance); payment_mode; payment_ref (cheque no / UTR).
- date as YYYY-MM-DD (Indian dates are day-month-year).
- If the same bill appears twice (same bill number and chassis), list it once.
- Leave a field empty ("" or 0) if it is not present or not readable. Never invent a value.`;
    const d=await aiRun(a.key,a.parts,prompt,SALES_SCHEMA,'sales');
    if(!d.sales?.length) throw new Error('No sale bill found in these photos. Try again with clear, straight photos.');
    reviewSales(d.sales);
  }catch(e){aiFail(e)}
}
function saleMatch(ch,en,pool){
  const t=x=>x&&x.length>=5?x.slice(-5):'';
  let st=pool.find(s=>(ch&&s.chassis===ch)||(en&&s.engine===en));
  if(!st){const c=pool.filter(s=>(t(ch)&&t(s.chassis)===t(ch))||(t(en)&&t(s.engine)===t(en))); if(c.length===1) st=c[0]}
  return st||null;
}
function reviewSales(L){
  window.__sales=L;
  const avail=DB.stock.filter(isIn), seen=new Set(); let nSold=0,nTwice=0,nNew=0;
  const one=x=>{x=txt(x);return /[,;&]|\band\b|\d\s+\d/i.test(x)?'':x};
  const inp=(n,v,w,extra='')=>`<input name="${n}" value="${esc(v)}" style="min-width:${w}px" ${extra}>`;
  const rows=L.map((d,i)=>{
    const ch=up(d.chassis), en=up(d.engine), st=saleMatch(ch,en,avail);
    const sold=!st&&DB.stock.some(s=>s.status==='sold'&&((ch&&s.chassis===ch)||(en&&s.engine===en)));
    const k=(ch||en)+'|'+one(d.sale_challan_no), twice=!!(ch||en)&&seen.has(k); seen.add(k);
    if(sold)nSold++; if(twice)nTwice++; if(!st&&!sold)nNew++;
    const tag=sold?'<span class="pill sold">Already sold</span>':twice?'<span class="pill due">Appears twice</span>':st?`<span class="pill in">Found in stock</span>${st.chassis!==ch?`<div class="muted mono" style="font-size:11px">${esc(st.chassis)}</div>`:''}`:'<span class="pill due">Not in stock — will be added</span>';
    return `<tr data-i="${i}" data-st="${st?st.id:''}"><td><input type="checkbox" ${sold||twice?'':'checked'} style="width:auto"></td>
    <td>${inp('schallan',one(d.sale_challan_no),70,'placeholder="Sale no."')}</td><td>${inp('pchallan',one(d.purchase_challan_no)||(st&&st.challan)||'',75,'placeholder="Purch. no."')}</td><td><input type="date" name="date" value="${esc(toISO(d.date)||today())}"></td>
    <td>${inp('name',txt(d.customer_name),130)}</td><td>${inp('relName',txt(d.relative_name),110,'placeholder="Father/Husband"')}</td><td>${inp('phone',txt(d.phone),100)}</td>
    <td>${inp('model',txt(d.model),120,'list="dlModels"')}</td><td>${inp('chassis',ch,160,'class="mono"')}</td><td>${inp('engine',en,120,'class="mono"')}</td>
    <td>${inp('price',num(d.price)||'',80,'inputmode="decimal"')}</td><td>${inp('finance',num(d.finance_amount)||'',75,'inputmode="decimal"')}</td><td>${inp('financer',txt(d.financer),80)}</td>
    <td>${inp('paid',num(d.paid_amount)||'',75,'inputmode="decimal"')}</td><td><select name="mode" style="width:auto">${opts(['Cash','Cheque','UPI','Bank'],d.payment_mode||'Cash')}</select></td><td>${tag}</td></tr>`}).join('');
  openDlg(`${L.length} sales found in bills — check and Save`,`
  ${nSold||nTwice?`<p class="warn" style="margin-top:0">${nSold?`<b>${nSold}</b> already sold. `:''}${nTwice?`<b>${nTwice}</b> bill(s) appear twice. `:''}These are unticked and will not be added again.</p>`:''}
  ${nNew?`<p class="note" style="margin-top:0">${nNew} vehicle(s) not found in stock — on Save they will be added to stock as sold. Please double-check the chassis numbers.</p>`:''}
  <div class="tablewrap imp"><table id="slT"><tr><th></th><th>Sale Challan</th><th>Purchase Challan</th><th>Date</th><th>Customer</th><th>S/o</th><th>Mobile</th><th>Model</th><th>Chassis</th><th>Engine</th><th>Price</th><th>Finance</th><th>Financer</th><th>Paid</th><th>Mode</th><th></th></tr>${rows}</table></div>
  ${dl('dlModels',DB.settings.models)}
  <p class="note">⚠ Check the names, numbers and amounts read by AI against the bills. Untick any sale you do not want to add.</p>`,
  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveSales()">Save all sales</button>`);
  dlg.style.maxWidth='1400px'; dlg.addEventListener('close',()=>dlg.style.maxWidth='',{once:true});
}
function saveSales(){
  const L=window.__sales||[], out=[], bad=[], skipped=[];
  const used=new Set();
  [...document.querySelectorAll('#slT tr')].slice(1).forEach((tr,n)=>{
    if(!tr.querySelector('input[type=checkbox]').checked) return;
    const g=k=>{const e=tr.querySelector(`[name=${k}]`);return e?txt(e.value):''}, d=L[+tr.dataset.i]||{};
    const r={schallan:g('schallan'),pchallan:g('pchallan'),key:up(d.key_no),date:g('date')||today(),name:g('name'),relName:g('relName'),phone:g('phone'),model:g('model'),chassis:up(g('chassis')),engine:up(g('engine')),
      price:num(g('price')),finance:num(g('finance')),financer:g('financer'),paid:num(g('paid')),mode:g('mode')||'Cash',
      rel:d.relation||'S/o',address:txt(d.address),extra:num(d.accessories),exchange:txt(d.exchange_vehicle),exchangeValue:num(d.exchange_value),ref:txt(d.payment_ref),notes:txt(d.notes),colour:txt(d.colour)};
    if(!r.name||!(r.chassis||r.engine)){bad.push(n+1);return}
    out.push(r);
  });
  if(bad.length){alert(`Line ${bad.join(', ')}: customer name or Chassis/Engine no. is empty. Fill it in or untick it.`);return}
  if(!out.length){alert('No sale selected.');return}
  let made=0;
  for(const r of out){
    const avail=DB.stock.filter(s=>isIn(s)&&!used.has(s.id));
    let st=saleMatch(r.chassis,r.engine,avail);
    if(!st&&DB.stock.some(s=>s.status==='sold'&&((r.chassis&&s.chassis===r.chassis)||(r.engine&&s.engine===r.engine)))){skipped.push(r.chassis||r.engine);continue}
    if(st){if(!st.challan&&r.pchallan)st.challan=r.pchallan; if(!st.key&&r.key)st.key=r.key}
    if(!st){st={id:uid(),created:Date.now(),status:'in',date:r.date,challan:r.pchallan,model:r.model,colour:r.colour,engine:r.engine,chassis:r.chassis,key:r.key,cost:''};DB.stock.push(st);
      if(r.model&&!DB.settings.models.includes(r.model))DB.settings.models.push(r.model)}
    used.add(st.id);
    const id=uid(), inv=Math.max(num(DB.settings.nextInv)||1,1+Math.max(0,...DB.sales.map(x=>num(x.inv)))); DB.settings.nextInv=inv+1;
    const sale={id,inv,schallan:r.schallan,created:Date.now()+made,date:r.date,stockId:st.id,model:st.model||r.model,colour:st.colour||r.colour,chassis:st.chassis||r.chassis,engine:st.engine||r.engine,key:st.key,
      name:r.name,rel:r.rel,relName:r.relName,phone:r.phone,address:r.address,price:r.price,extra:r.extra,total:r.price+r.extra,
      finance:r.finance,financer:r.financer,financeReceived:false,exchange:r.exchange,exchangeValue:r.exchangeValue,notes:r.notes,payments:[]};
    DB.sales.push(sale); st.status='sold'; st.saleId=id;
    if(r.paid>0) addPayment(sale,{date:r.date,amount:r.paid,mode:r.mode,ref:r.ref});
    made++;
  }
  save(); dlg.close(); toast(`${made} sales added`+(skipped.length?` · ${skipped.length} already sold, skipped`:'')); go('sales');
}

async function aiPay(files){
  try{
    const a=await aiPrep(files,'Reading bill / receipt…'); if(!a) return;
    const prompt=`This photo is from an Indian two-wheeler showroom's accounts. It may be an expense bill or receipt (electricity, rent, fuel, tea, repairs, purchases), a receipt the showroom gave to someone, a UPI / bank payment screenshot, a cheque, or a handwritten cash book / day book page with many lines.
Extract every money transaction shown.
- direction: "out" if the showroom paid money (expense bill, purchase, payment made); "in" if the showroom received money. On a day book page, Receipts / आमद are "in" and Payments / खर्चा are "out".
- particulars: a short description, e.g. "Electricity bill UHBVN", "Tea", "Plumber", "Received from Ramesh – booking". Keep Hindi words if written in Hindi. Resolve ditto marks ("-do-", "〃") from the line above.
- amount: the final total (including tax), number only.
- mode: UPI for UPI screenshots, Cheque for cheques, Bank for NEFT / RTGS / IMPS / bank transfer, otherwise Cash.
- ref: bill no / cheque no / UTR / transaction id if shown, else "".
- date as YYYY-MM-DD (Indian dates are day-month-year); for ditto use the date above; "" if not shown.
- Skip total, balance and carried-forward lines. Never invent a value.`;
    const d=await aiRun(a.key,a.parts,prompt,PAY_SCHEMA,'payments');
    if(!d.entries?.length) throw new Error('No amount found in this photo. Try again with a clear, straight photo.');
    reviewPhotoPay(d.entries);
  }catch(e){aiFail(e)}
}
function reviewPhotoPay(E){
  const dup=e=>DB.daybook.some(x=>x.date===(toISO(e.date)||today())&&x.type===e.direction&&Math.round(num(x.amount))===Math.round(num(e.amount)));
  const sel=(n,arr,v)=>`<select name="${n}" style="width:auto">${arr.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>`;
  openDlg(`${E.length} entries found in photo — check and Save`,`<div class="tablewrap imp"><table id="pyT"><tr><th></th><th>Date</th><th>In / Out</th><th>Particulars</th><th>Amount ₹</th><th>Mode</th><th>Bill / Ref</th><th></th></tr>
  ${E.map(e=>{const dp=dup(e);return `<tr><td><input type="checkbox" ${dp?'':'checked'} style="width:auto"></td><td><input type="date" name="date" value="${esc(toISO(e.date)||today())}"></td>
  <td>${sel('type',[['in','Receipt (in)'],['out','Payment (out)']],e.direction)}</td><td><input name="particulars" value="${esc(e.particulars)}" style="min-width:200px"></td>
  <td><input name="amount" inputmode="decimal" value="${num(e.amount)||''}" style="width:100px"></td><td>${sel('mode',['Cash','Bank','UPI','Cheque'].map(m=>[m,m]),e.mode)}</td>
  <td><input name="ref" value="${esc(e.ref)}" style="width:110px"></td><td>${dp?'<span class="pill due">Possibly duplicate</span>':''}</td></tr>`}).join('')}</table></div>
  <p class="note">⚠ Check amounts read by AI against the bill. Untick any entry you do not want. Record vehicle payments from customers via “Receive payment” in Sales so their dues update.</p>`,
  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="savePhotoPay()">Save to Day Book</button>`);
}
function savePhotoPay(){
  const out=[];
  [...document.querySelectorAll('#pyT tr')].slice(1).forEach(tr=>{
    if(!tr.querySelector('input[type=checkbox]').checked) return;
    const g=n=>txt(tr.querySelector(`[name=${n}]`).value), a=num(g('amount'));
    if(a>0&&g('particulars')) out.push({date:g('date')||today(),type:g('type'),particulars:g('particulars')+(g('ref')?' · '+g('ref'):''),mode:g('mode'),amount:a});
  });
  if(!out.length){alert('No entry selected (or amount / particulars empty).');return}
  const t0=Date.now(); out.forEach((e,i)=>DB.daybook.push({id:uid(),created:t0+i,...e}));
  save(); dlg.close(); toast(`${out.length} entries added to Day Book`); render();
}

function parseCSV(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/)[0];
  const sep=first.includes(',')?',':first.includes(';')?';':'\t';
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===sep){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);rows.push(row);row=[];f='' }
    else f+=c }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function toISO(v){
  const p=(y,m,d)=>{y=+y;if(y<100)y+=2000;m=+m;d=+d;if(!(m>=1&&m<=12&&d>=1&&d<=31))return '';return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(txt(v))){const n=+v;if(n>20000&&n<80000)return new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);return ''}
  const s=txt(v); let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)) return p(m[1],m[2],m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)) return p(m[3],m[2],m[1]);
  if(m=s.match(/^(\d{1,2})[-\s\/.]*([a-z]{3})[a-z]*[-\s\/.,]*(\d{2,4})/i)) return MON[m[2].toLowerCase()]?p(m[3],MON[m[2].toLowerCase()],m[1]):'';
  return '';
}
function readRecords(rows,fields){
  for(let r=0;r<Math.min(rows.length,15);r++){
    const idx={};
    (rows[r]||[]).forEach((h,i)=>{const n=norm(h); if(!n) return; for(const f in fields) if(!(f in idx)&&fields[f].includes(n)){idx[f]=i;break}});
    if(Object.keys(idx).length>=2){
      const recs=[];
      for(let i=r+1;i<rows.length;i++){const row=rows[i]||[]; if(!row.some(c=>txt(c))) continue;
        const o={}; for(const f in idx) o[f]=row[idx[f]]; recs.push({o,line:i+1})}
      return {idx,recs};
    }
  }
  return null;
}
function planStock(rows){
  const h=readRecords(rows,STOCK_F); if(!h||!('chassis' in h.idx||'engine' in h.idx)) return null;
  const add=[],skip=[],err=[];
  const sc=new Set(DB.stock.map(s=>s.chassis).filter(Boolean)), se=new Set(DB.stock.map(s=>s.engine).filter(Boolean));
  for(const {o,line} of h.recs){
    const s={date:toISO(o.date)||today(),challan:txt(o.challan),model:txt(o.model),colour:txt(o.colour),engine:up(o.engine),chassis:up(o.chassis),key:up(o.key),cost:txt(o.cost)?String(num(o.cost)):''};
    if(!s.chassis&&!s.engine){err.push(`Row ${line}: no chassis / engine no`);continue}
    if(!s.model){err.push(`Row ${line}: model is empty`);continue}
    if((s.chassis&&sc.has(s.chassis))||(s.engine&&se.has(s.engine))){skip.push(`Row ${line}: ${s.chassis||s.engine} is already in the app`);continue}
    if(s.chassis)sc.add(s.chassis); if(s.engine)se.add(s.engine);
    s.status=/sold/i.test(txt(o.status))?'sold':'in'; add.push(s);
  }
  return {which:'stock',add,skip,err};
}

  for(const {o,line} of h.recs){

function tallyVouchers(from,to){

    if(g>0){const base=r2(tot/(1+g/100)),tax=r2(tot-base),c=r2(tax/2);L.push([T.purchase,base],[T.cgst,c],[T.sgst,r2(tax-c)])} else L.push([T.purchase,tot]);

    const a=num(d.amount), cap=d.capId&&DB.capital.find(c=>c.id===d.capId), capL=cap&&`${pName(cap.partnerId)} Capital A/c`;
    if(cap&&d.type==='in'){V.push({type:'Receipt',date:d.date,id:'d'+d.id,nar:d.particulars,L:[[modeL(d.mode),a],[capL,-a]]});continue}
    if(cap&&cap.type==='out'){V.push({type:'Payment',date:d.date,id:'d'+d.id,nar:d.particulars,L:[[capL,a],[modeL(d.mode),-a]]});continue}
    V.push(d.type==='in'?{type:'Receipt',date:d.date,id:'d'+d.id,nar:d.particulars,L:[[modeL(d.mode),a],[T.income,-a]]}

async function readOpenAI(key,parts,prompt,schema=CH_SCHEMA,sname='challan'){
  const content=[{type:'text',text:prompt},...parts.map(p=>p.pdf?{type:'file',file:{filename:p.name,file_data:'data:application/pdf;base64,'+p.b64}}
    :{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+p.b64,detail:'high'}})];
  let res;
  try{
    res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},
      body:JSON.stringify({model:oaiModel(),max_completion_tokens:16000,messages:[{role:'user',content}],
        response_format:{type:'json_schema',json_schema:{name:sname,strict:true,schema}}})});
  }catch(e){throw new Error('Could not connect to the internet. Check your connection and try again.')}
  const j=await res.json().catch(()=>({})), er=j?.error||{}, em=er.message||'';
  if(!res.ok) throw new Error(res.status===401?'API key is wrong. Enter the correct key in Settings.'
    :er.code==='insufficient_quota'||/quota|billing|credit/i.test(em)?'Your OpenAI API account has no balance. Add balance at platform.openai.com → Billing (ChatGPT Plus does not count here).'
    :er.code==='model_not_found'||/model/i.test(em)&&res.status===404?`Model "${oaiModel()}" was not found in your account. Check the model name in Settings.`
    :[429,500,502,503].includes(res.status)?'The server is busy. Try again in 1–2 minutes.':'Error '+res.status+': '+em);
  const ch=j.choices?.[0]||{}, m=ch.message||{};
  if(m.refusal) throw new Error('This photo could not be read. Try another photo.');
  if(ch.finish_reason==='length') throw new Error('Too many pages. Add the pages in smaller batches.');
  try{return JSON.parse(m.content||'')}catch(e){throw new Error('Could not understand the response. Please try again.')}
}
async function readClaude(key,parts,prompt,schema=CH_SCHEMA){
    const content=[...parts.map(p=>p.pdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:p.b64}}
      :{type:'image',source:{type:'base64',media_type:'image/jpeg',data:p.b64}}),{type:'text',text:prompt}];
    let res;
    try{
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21',
        'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',output_config:{format:{type:'json_schema',schema}},messages:[{role:'user',content}]})});
    }catch(e){throw new Error('Could not connect to the internet. Check your connection and try again.')}
    const j=await res.json().catch(()=>({})), em=j?.error?.message||'';
    if(!res.ok) throw new Error(res.status===401?'API key is wrong. Enter the correct key in Settings.'
      :/credit|balance|billing/i.test(em)?'Your Anthropic account has no balance. Add balance at console.anthropic.com → Billing.'
      :[429,500,502,503,529].includes(res.status)?'The server is busy. Try again in 1–2 minutes.'
      :/too large|size|exceed/i.test(em)?'File too large. Use fewer pages or smaller photos.':'Error '+res.status+': '+em);
    if(j.stop_reason==='refusal') throw new Error('This photo could not be read. Try another photo.');
    if(j.stop_reason==='max_tokens') throw new Error('Too many pages. Add the pages in smaller batches.');
    try{return JSON.parse((j.content||[]).find(b=>b.type==='text')?.text||'')}catch(e){throw new Error('Could not understand the response. Please try again.')}
}
function reviewChallan(d){
  const sc=new Set(DB.stock.map(s=>s.chassis).filter(Boolean)), se=new Set(DB.stock.map(s=>s.engine).filter(Boolean));
  const bc=new Set(), be=new Set();
  const inp=(n,v,w,extra='')=>`<input name="${n}" value="${esc(v)}" style="min-width:${w}px" ${extra}>`;
  const one=x=>{x=txt(x);return /[,;&]|\band\b|\d\s+\d/i.test(x)?'':x};
  const topD=toISO(d.date)||'', topN=one(d.challan_no);
  let nDup=0, nTwice=0; const anyPer=d.vehicles.some(v=>one(v.challan_no));
  const rows=d.vehicles.map(v=>{const ch=up(v.chassis),en=up(v.engine);
    const dup=(ch&&sc.has(ch))||(en&&se.has(en)), twice=!dup&&((ch&&bc.has(ch))||(en&&be.has(en)));
    if(ch)bc.add(ch); if(en)be.add(en); if(dup)nDup++; if(twice)nTwice++;
    const cn=one(v.challan_no)||(anyPer?'':topN), cd=toISO(v.date)||(anyPer?'':topD);
    return `<tr><td><input type="checkbox" ${dup||twice?'':'checked'} style="width:auto"></td>
    <td>${inp('challan',cn,90,'placeholder="Challan no."'+(cn?'':' style="min-width:90px;border-color:var(--amber)"'))}</td><td><input type="date" name="date" value="${esc(cd)}"></td>
    <td>${inp('model',v.model,150,'list="dlModels"')}</td><td>${inp('colour',v.colour,100,'list="dlCols"')}</td>
    <td>${inp('engine',en,140,'class="mono"')}</td><td>${inp('chassis',ch,180,'class="mono"')}</td><td>${inp('key',up(v.key),70,'class="mono"')}</td><td>${inp('cost',num(v.price)||'',90,'inputmode="decimal"')}</td>
    <td>${dup?'<span class="pill due">Already in stock</span>':twice?'<span class="pill due">Twice in photos</span>':''}</td></tr>`}).join('');
  openDlg(`${d.vehicles.length} vehicles found in challan — check and Save`,`
  ${nDup||nTwice?`<p class="warn" style="margin-top:0">${nDup?`<b>${nDup}</b> already in stock. `:''}${nTwice?`<b>${nTwice}</b> appear twice in the photos. `:''}These are unticked and will not be added again.</p>`:''}
  <div class="row"><label class="grow">Challan no. for rows left blank<input id="chN" value="${esc(topN)}" placeholder="Challan no."></label>
    <label class="grow">Date for rows left blank<input type="date" id="chD" value="${esc(topD||today())}"></label></div>
  ${d.supplier?`<p class="note">Supplier: ${esc(d.supplier)}</p>`:''}
  <div class="tablewrap imp" style="margin-top:10px"><table id="chT"><tr><th></th><th>Challan</th><th>Date</th><th>Model</th><th>Colour</th><th>Engine No</th><th>Chassis No</th><th>Key</th><th>Price</th><th></th></tr>
  ${rows}</table></div>
  ${dl('dlModels',DB.settings.models)}${dl('dlCols',DB.settings.colours)}
  <p class="note">⚠ Check the numbers read by AI against the challan — especially Engine and Chassis No. Challan no. and date can be changed per vehicle (or left blank and filled later). Untick any vehicle you do not want to add.</p>`,
  `<button class="btn plain" onclick="dlg.close()">Cancel</button><button class="btn" onclick="saveChallan()">Save to stock</button>`);
  dlg.style.maxWidth='1100px'; dlg.addEventListener('close',()=>dlg.style.maxWidth='',{once:true});
}
function saveChallan(){
  const defD=$('#chD').value||today(), defN=txt($('#chN').value), out=[], bad=[], skipped=[];
  const sc=new Set(DB.stock.map(s=>s.chassis).filter(Boolean)), se=new Set(DB.stock.map(s=>s.engine).filter(Boolean));
  [...document.querySelectorAll('#chT tr')].slice(1).forEach((tr,i)=>{
    if(!tr.querySelector('input[type=checkbox]').checked) return;
    const g=n=>txt(tr.querySelector(`[name=${n}]`).value);
    const s={date:g('date')||defD,challan:g('challan')||defN,model:g('model'),colour:g('colour'),engine:up(g('engine')),chassis:up(g('chassis')),key:up(g('key')),cost:g('cost')?String(num(g('cost'))):''};
    if(!s.model||!(s.chassis||s.engine)){bad.push(i+1);return}
    if((s.chassis&&sc.has(s.chassis))||(s.engine&&se.has(s.engine))){skipped.push(s.chassis||s.engine);return}
    if(s.chassis)sc.add(s.chassis); if(s.engine)se.add(s.engine); out.push(s);
  });
  if(bad.length){alert(`Line ${bad.join(', ')}: Model or Chassis/Engine No is empty. Fill it in or untick it.`);return}
  if(!out.length){alert(skipped.length?`All selected vehicles (${skipped.length}) are already in stock — nothing added.`:'No vehicle selected.');return}
  const t0=Date.now();
  out.forEach((s,i)=>{DB.stock.push({id:uid(),created:t0+i,status:'in',...s});
    if(s.model&&!DB.settings.models.includes(s.model))DB.settings.models.push(s.model);
    if(s.colour&&!DB.settings.colours.includes(s.colour))DB.settings.colours.push(s.colour)});
  save(); dlg.close(); toast(`${out.length} vehicles added to stock`+(skipped.length?` · ${skipped.length} already existed, skipped`:'')); go('stock');
}

/* ---------- cloud sync (Firebase) ---------- */
const SHOP='chhachhrauli', FBV='12.19.0', CPK=KEY+'_cloudproj', PRE=KEY+'_precloud';
const COLS=['stock','sales','daybook','enquiries','partners','capital'];
const jparse=j=>{try{return JSON.parse(j)}catch(e){return null}};
const localHas=()=>COLS.some(c=>(DB[c]||[]).length);
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function cloudScreen(html){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:460px;margin:40px auto">${html}</div>`}
function syncLabel(){
  if(READONLY) return '📴 Offline – view only';
  if(!cloudReady) return '';
  if(SYNC_ST==='err') return '⚠ Sync problem';
  if(pendingN>0) return navigator.onLine?'⏳ Saving…':'📴 Offline – will sync when online';
  return '☁ Synced';
}
function setSync(s){if(s!==undefined)SYNC_ST=s;const t=syncLabel();const a=$('#sync');if(a)a.textContent=t+(cloudReady&&cloudEmail?' · '+cloudEmail:'');const b=$('#sync2');if(b)b.textContent=t}
addEventListener('online',()=>setSync());addEventListener('offline',()=>setSync());

async function cloudInit(){
  cloudScreen('<div class="empty">⏳ Connecting to cloud…</div>');
  const b=window.__FBBASE||`https://www.gstatic.com/firebasejs/${FBV}/`;
  try{
    const [A,U,F]=await Promise.all(['app','auth','firestore'].map(m=>import(b+'firebase-'+m+'.js')));
    const app=A.initializeApp(fbCfg()), auth=U.getAuth(app);
    let db; try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    FB={A,U,F,app,auth,db};
  }catch(e){
    cloudScreen(`<h2>No internet</h2><p style="margin-top:0">Internet is needed to connect to the cloud.</p><div class="row"><button class="btn" onclick="location.reload()">Try again</button>${localHas()?'<button class="btn plain" onclick="READONLY=true;setSync();render()">View saved data (read only)</button>':''}</div>`);
    return;
  }
  FB.U.onAuthStateChanged(FB.auth,u=>{if(u){cloudEmail=u.email||'';cloudStart()}else showLogin()});
}
function showLogin(msg=''){
  cloudReady=false; setSync('');
  cloudScreen(`<h2>Login – ${esc(DB.settings.name)}</h2>${msg?`<p class="warn">${esc(msg)}</p>`:''}
  <form id="flog" class="grid" style="grid-template-columns:1fr" onsubmit="doLogin(event)">
    <label>Email<input name="email" type="email" autocomplete="username" autocapitalize="none" required></label>
    <label>Password<input name="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn">Login</button></form>
  <p class="note"><a href="#" onclick="forgotPw();return false">Forgot password?</a></p>`);
}
function authMsg(er){const c=(er&&er.code)||'';return /invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)?'Wrong email or password.':/too-many/.test(c)?'Too many failed attempts. Try again later.':/network/.test(c)?'No internet.':'Login failed ('+(c||er)+')'}
async function doLogin(e){
  e.preventDefault(); const d=formData(e.target), b=e.target.querySelector('button'); b.disabled=true; b.textContent='⏳ …';
  try{await FB.U.signInWithEmailAndPassword(FB.auth,d.email,d.pw)}catch(er){showLogin(authMsg(er))}
}
async function forgotPw(){
  const em=txt($('#flog [name=email]').value); if(!em){alert('Enter your email above first.');return}
  try{await FB.U.sendPasswordResetEmail(FB.auth,em);alert('A password reset link has been sent to '+em+' (check the Spam folder too).')}catch(er){alert(authMsg(er))}
}
function cloudStart(){
  cloudScreen('<div class="empty">⏳ Loading data…</div>');
  const slow=setTimeout(()=>{if(!cloudReady&&!READONLY)cloudScreen('<div class="empty">⏳ Loading data… the internet seems slow.<br><br><button class="btn plain" onclick="location.reload()">Try again</button></div>')},20000);
  const {F,db}=FB, init={}, need=COLS.length+1; let started=false;
  const begin=()=>{if(started||Object.keys(init).length<need)return; started=true; clearTimeout(slow); cloudFirst(init)};
  COLS.forEach(c=>UNSUB.push(F.onSnapshot(F.collection(db,'shops',SHOP,c),{includeMetadataChanges:true},snap=>{
    if(!cloudReady){ if(started) return; if(snap.metadata.fromCache&&snap.empty) return; init[c]=snap.docs.map(d=>d.data().j); begin(); return }
    remoteCol(c,snap);
  },cloudErr)));
  UNSUB.push(F.onSnapshot(F.doc(db,'shops',SHOP,'meta','settings'),{includeMetadataChanges:true},snap=>{
    if(!cloudReady){ if(started) return; if(snap.metadata.fromCache&&!snap.exists()) return; init._s=snap.exists()?snap.data().j:null; begin(); return }
    if(snap.exists()) remoteSettings(snap.data().j);
  },cloudErr));
}
function cloudFirst(init){
  const pid=fbCfg().projectId, wasCache=localStorage.getItem(CPK)===pid;
  const cloudEmpty=COLS.every(c=>!init[c].length)&&!init._s;
  const cdb={settings:(init._s&&jparse(init._s))||structuredClone(DB.settings)};
  COLS.forEach(c=>cdb[c]=init[c].map(jparse).filter(Boolean));
  const syncedFromInit=()=>{SYNCED={};COLS.forEach(c=>{SYNCED[c]=new Map(init[c].map(j=>{const r=jparse(j);return r&&[r.id,j]}).filter(Boolean))});SYNCED._s=init._s||undefined};
  window.__cloudFinish=(choice)=>{
    if(choice==='upload'){ syncedFromInit(); }                                   // keep local DB, push all
    else if(choice==='fresh'){ try{localStorage.setItem(PRE,JSON.stringify(DB))}catch(e){} DB={...structuredClone(DEFAULTS),settings:DB.settings}; syncedFromInit(); }
    else { if(localHas()&&!wasCache){try{localStorage.setItem(PRE,JSON.stringify(DB))}catch(e){}} DB=cdb; syncedFromInit(); }
    for(const k in DEFAULTS) if(!(k in DB)) DB[k]=structuredClone(DEFAULTS[k]);
    try{localStorage.setItem(CPK,pid)}catch(e){}
    cloudReady=true; cacheLocal(); cloudPush(); setSync('ok'); render();
    if(choice==='cloud'&&localStorage.getItem(PRE)&&!wasCache&&localHas0) toast('This device’s old data has been kept aside (see Settings)');
  };
  const localHas0=localHas();
  if(cloudEmpty&&localHas0&&!wasCache){
    const n=c=>(DB[c]||[]).length;
    cloudScreen(`<h2>The cloud is empty</h2><p style="margin-top:0">This device has <b>${n('stock')}</b> vehicles, <b>${n('sales')}</b> sales, <b>${n('daybook')}</b> day book entries.</p>
    <p>Upload this data to the cloud? It will then appear on all devices.</p>
    <div class="row"><button class="btn" onclick="__cloudFinish('upload')">Yes, upload to cloud</button><button class="btn plain" onclick="if(confirm('The cloud will start empty. This device’s data will be kept aside in Settings. OK?'))__cloudFinish('fresh')">No, start empty</button></div>`);
  } else if(cloudEmpty) __cloudFinish('upload');
  else __cloudFinish('cloud');
}
function remoteCol(c,snap){
  const m=SYNCED[c]||(SYNCED[c]=new Map()); let ch=false;
  for(const x of snap.docChanges()){
    const id=x.doc.id;
    if(x.type==='removed'){ if(m.has(id)){m.delete(id);DB[c]=DB[c].filter(r=>r.id!==id);ch=true} continue }
    const j=x.doc.data().j; if(m.get(id)===j) continue;
    const r=jparse(j); if(!r) continue; m.set(id,j);
    const i=DB[c].findIndex(o=>o.id===id); if(i<0) DB[c].push(r); else DB[c][i]=r; ch=true;
  }
  if(ch) remoteChanged();
}
function remoteSettings(j){ if(SYNCED._s===j) return; const s=jparse(j); if(!s) return; SYNCED._s=j; DB.settings=s; remoteChanged() }
function remoteChanged(){
  cacheLocal();
  const ae=document.activeElement, typing=ae&&$('#app').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if(dlg.open||appDirty||typing){$('#syncbar').classList.remove('hide');return}
  render();
}
function cloudPush(){
  if(!FB||!cloudReady) return;
  const {F,db}=FB, ops=[];
  for(const c of COLS){ const m=SYNCED[c]||(SYNCED[c]=new Map()), seen=new Set();
    for(const r of DB[c]){ if(!r.id) r.id=uid(); seen.add(r.id); const j=JSON.stringify(r); if(m.get(r.id)!==j){m.set(r.id,j);ops.push([c,r.id,j])} }
    for(const id of [...m.keys()]) if(!seen.has(id)){m.delete(id);ops.push([c,id,null])}
  }
  const sj=JSON.stringify(DB.settings); if(SYNCED._s!==sj){SYNCED._s=sj;ops.push(['meta','settings',sj])}
  if(!ops.length) return;
  const ps=[];
  for(let i=0;i<ops.length;i+=400){ const b=F.writeBatch(db);
    ops.slice(i,i+400).forEach(([c,id,j])=>{const ref=F.doc(db,'shops',SHOP,c,id); if(j===null) b.delete(ref); else b.set(ref,{j,by:cloudEmail,at:F.serverTimestamp()})});
    ps.push(b.commit()) }
  pendingN++; setSync();
  Promise.all(ps).then(()=>{pendingN--;setSync('ok')},e=>{pendingN--;setSync('err');cloudErr(e)});
}
function cloudErr(e){
  const c=(e&&e.code)||'';
  if(/permission-denied/.test(c)){ cloudReady=false; UNSUB.forEach(u=>{try{u()}catch(x){}}); UNSUB=[];
    cloudScreen(`<h2>Access denied</h2><p style="margin-top:0"><b>${esc(cloudEmail)}</b> does not have access to this showroom’s data. Add this email to the Firestore Rules in Firebase.</p><button class="btn" onclick="cloudLogout(true)">Logout</button>`); return }
  toast('⚠ Sync error: '+(c||(e&&e.message)||e));
}
async function cloudLogout(force){
  if(!force&&pendingN>0&&!confirm('Some entries have not reached the cloud yet (no internet). Logging out will lose them. Log out anyway?')) return;
  UNSUB.forEach(u=>{try{u()}catch(e){}}); UNSUB=[];
  try{localStorage.removeItem(KEY);localStorage.removeItem(CPK)}catch(e){}
  try{await FB.U.signOut(FB.auth)}catch(e){}
  try{await FB.F.terminate(FB.db);await FB.F.clearIndexedDbPersistence(FB.db)}catch(e){}
  location.reload();
}
function rulesText(s){
  const em=[...new Set(String(s||'').split(/[,\s;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /shops/${SHOP}/{document=**} {
      allow read, write: if request.auth != null
        && request.auth.token.email.lower() in [${em.map(e=>`'${e}'`).join(', ')}];
    }
  }
}`}
function parseFbCfg(t){const o={};String(t||'').replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v});
  return o.apiKey&&o.projectId&&o.appId?{apiKey:o.apiKey,authDomain:o.authDomain||'',projectId:o.projectId,storageBucket:o.storageBucket||'',messagingSenderId:o.messagingSenderId||'',appId:o.appId}:null}
function saveFbCfg(){const c=parseFbCfg($('#fbIn').value);
  if(!c){alert('Config is incomplete. Copy the whole “firebaseConfig = { … }” block from Firebase.');return}
  if(!confirm('Turn on cloud? You will need to log in after this.'))return;
  try{localStorage.setItem(FBK,JSON.stringify(c))}catch(e){} location.reload()}
function rulesBox(v){return `<details style="margin-top:10px"><summary>Firebase Rules – which emails have access</summary>
  <p class="note">Enter all login emails separated by commas, then paste the full text below into Firebase → Firestore → Rules and Publish.</p>
  <input id="rulesEm" value="${esc(v)}" placeholder="aap@gmail.com, partner@gmail.com" oninput="$('#rulesOut').value=rulesText(this.value)">
  <textarea id="rulesOut" readonly style="min-height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:6px">${esc(rulesText(v))}</textarea></details>`}
function cloudCard(){
  if(!CLOUD) return `<div class="card"><h2>☁ Cloud sync – same data on laptop, iPad and phone</h2>
  <p style="margin-top:0">After creating a Firebase project, paste its config (firebaseConfig) here.</p>
  <textarea id="fbIn" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  projectId: &quot;…&quot;, …&#10;};"></textarea>
  <div style="margin-top:8px"><button class="btn" onclick="saveFbCfg()">Turn on cloud</button></div>${rulesBox('')}</div>`;
  const pre=(()=>{try{return localStorage.getItem(PRE)}catch(e){return ''}})();
  return `<div class="card"><h2>☁ Cloud sync</h2>
  <p style="margin-top:0">Login: <b>${esc(cloudEmail)}</b> · Project: <span class="mono">${esc(fbCfg().projectId)}</span> · <span id="sync2">${syncLabel()}</span></p>
  <p class="note" style="margin-top:0">Every entry is saved to the cloud automatically and appears on other devices within seconds. Without internet you can keep working; it syncs when you are back online.</p>
  <div class="row" style="margin-top:8px"><button class="btn plain" onclick="cloudLogout()">Logout</button>
  ${!FB_CONFIG?`<button class="btn plain" onclick="if(confirm('Turn off cloud on this device? (cloud data will not be deleted)')){try{localStorage.removeItem(FBK)}catch(e){};cloudLogout()}">Turn off cloud on this device</button>`:''}
  ${pre?`<button class="btn plain" onclick="download('old-device-data-${today()}.json',localStorage.getItem(PRE),'application/json')">⬇ This device’s old (pre-cloud) data</button>`:''}</div>
  ${rulesBox(cloudEmail)}</div>`;
}
$('#app').addEventListener('input',()=>{appDirty=true});
dlg.addEventListener('close',()=>{if(cloudReady&&!$('#syncbar').classList.contains('hide')&&!appDirty)render()});

if(CLOUD) cloudInit(); else render();
</script>
